name: Build zip from PR

on:
  pull_request:
    paths-ignore:
    - 'docs/**'
    branches:
      - 'master'

jobs:
  zip-pr:
    if: github.repository == 'wielebenwir/commonsbooking'
    runs-on: ubuntu-24.04
    steps:

     - uses: actions/checkout@v7
       with:
        fetch-depth: 0  # Important for getting full commit history

     - name: Update Version Comment
       run: |
        sed -i "s|define('COMMONSBOOKING_VERSION_COMMENT',.*|define('COMMONSBOOKING_VERSION_COMMENT', '${{ github.head_ref }} at ${{ github.event.pull_request.head.sha}}');|" commonsbooking.php

     - uses: ./.github/actions/build-plugin
       with:
         generate_zip: 'true'

     # The FTP upload and the PR comment happen in zip-pr-upload.yml (triggered
     # by workflow_run), because repository secrets and a write-capable token
     # are never available inside a fork's own pull_request run. Here we only
     # build the zip (no secrets required) and hand it over as an artifact.
     # Regular (archived) artifact: the inner commonsbooking.zip is restored
     # verbatim on download. Non-archived (archive: false) uploads are meant for
     # tarballs and do not round-trip a zip reliably through download-artifact.
     - name: Upload zip as artifact
       uses: actions/upload-artifact@v7
       with:
        name: commonsbooking-plugin
        path: commonsbooking.zip
