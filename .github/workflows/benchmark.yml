name: Benchmark

on:
  pull_request:
    paths-ignore:
    - 'docs/**'
    branches:
    - 'master'

jobs:
  benchmark:
    if: ${{ !startsWith(github.head_ref, 'dependabot') }}
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Not needed on self-hosted runners
      # - name: Set up MySQL
      #  run: |
      #    sudo /etc/init.d/mysql start

      # This is needed for the WordPress test suite installation ( bin/install-wp-tests.sh)
      # - name: Install SVN
      #  run: sudo apt install -y subversion

      # - uses: shivammathur/setup-php@v2
      #  with:
      #    php-version: 8.4
      #    extensions: uopz

      - name: Install test dependencies
        run: |
          bash bin/install-wp-tests.sh wordpress_test root root localhost latest false false true
          composer install --prefer-dist --no-progress

      - name: Run benchmark on PR branch
        run: |
          composer dump-autoload -o
          php tests/benchmark/phpbench.php run tests/benchmark --report=aggregate > /tmp/pr-benchmark.txt

      - name: Checkout master branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Install test dependencies (again for master branch)
        run: |
          bash bin/install-wp-tests.sh wordpress_test root root localhost latest false false true
          composer install --prefer-dist --no-progress

      - name: Run benchmark on master branch
        run: |
          composer dump-autoload -o
          php tests/benchmark/phpbench.php run tests/benchmark --report=aggregate > /tmp/master-benchmark.txt

      - name: Publish step summary
        run: |
          {
            echo "## Benchmark Results"
            echo ""
            echo "### PR Branch Results"
            echo '```'
            cat /tmp/pr-benchmark.txt
            echo '```'
            echo ""
            echo "### Master Branch Results"
            echo '```'
            cat /tmp/master-benchmark.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect benchmark results
        run: |
          mkdir -p benchmark-results
          cp /tmp/pr-benchmark.txt benchmark-results/
          cp /tmp/master-benchmark.txt benchmark-results/

      # The PR comment is posted from benchmark-comment.yml (workflow_run),
      # because GITHUB_TOKEN is read-only on pull requests from forks. Only the
      # raw benchmark output is handed over; the comment is assembled there from
      # trusted code so the untrusted output cannot inject markdown.
      - name: Upload benchmark results as artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results/
