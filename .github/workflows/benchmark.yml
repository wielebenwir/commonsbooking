name: Benchmark

on:
  pull_request:
    paths-ignore:
    - 'docs/**'
    branches:
    - 'master'

jobs:
  benchmark:
    if: ${{ !startsWith(github.head_ref, 'dependabot') }}
    runs-on: self-hosted
    env:
      BENCHMARK_BASELINE: /tmp/phpbench-baseline-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      # Not needed on self-hosted runners
      # - name: Set up MySQL
      #  run: |
      #    sudo /etc/init.d/mysql start

      # This is needed for the WordPress test suite installation ( bin/install-wp-tests.sh)
      # - name: Install SVN
      #  run: sudo apt install -y subversion

      # - uses: shivammathur/setup-php@v2
      #  with:
      #    php-version: 8.4
      #    extensions: uopz

      - name: Install test dependencies
        run: |
          bash bin/install-wp-tests.sh wordpress_test root root localhost latest false false true
          composer install --prefer-dist --no-progress

      - name: Run and save master baseline
        run: |
          composer dump-autoload -o
          php tests/benchmark/phpbench.php run tests/benchmark --tag=master --retry-threshold=5 --iterations=10
          mv .phpbench "$BENCHMARK_BASELINE"

      - name: Checkout PR commit
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install test dependencies for PR commit
        run: |
          bash bin/install-wp-tests.sh wordpress_test root root localhost latest false false true
          composer install --prefer-dist --no-progress

      - name: Compare PR commit with master baseline
        run: |
          composer dump-autoload -o
          mv "$BENCHMARK_BASELINE" .phpbench
          php tests/benchmark/phpbench.php run tests/benchmark --report=aggregate --ref=master --retry-threshold=5 --iterations=10 > "$RUNNER_TEMP/pr-benchmark.txt"

      - name: Prepare benchmark comment
        id: prepare-comment
        run: |
          {
            echo "## Benchmark Results (PR vs. master)"
            echo ""
            echo "\`\`\`"
            cat "$RUNNER_TEMP/pr-benchmark.txt"
            echo "\`\`\`"
          } > benchmark-comment.md
          cat benchmark-comment.md >> $GITHUB_STEP_SUMMARY

      - name: Find existing benchmark comment
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Benchmark Results'

      - name: Create or update benchmark comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-file: benchmark-comment.md
          edit-mode: replace
